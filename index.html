<title>에테리아 — 공략의 여행</title>
<style>
  :root{
    --bg:#0c0f16; --panel:rgba(16,20,30,.87); --edge:rgba(120,180,255,.28);
    --accent:#6ba8ff; --accent2:#ff7aa8; --soft:#cfe4ff; --gold:#ffcf6e; --xp:#7ee0a6;
    --ink:#f2f6fb; --muted:#9fb0c6; --dim:#68788f;
    --sans:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#05070b;font-family:var(--sans);color:var(--ink);overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  #app{position:relative;width:min(100vw,900px);aspect-ratio:9/16;max-height:100vh;
    background:var(--bg);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none}
  @media(min-aspect-ratio:1/1){#app{aspect-ratio:16/10;width:min(100vw,1040px)}}
  .screen{position:absolute;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  .btn{background:linear-gradient(135deg,var(--accent),#9cc4ff);color:#08213f;font-family:var(--sans);
    font-weight:800;font-size:16px;border:none;padding:14px 20px;border-radius:13px;cursor:pointer;
    box-shadow:0 8px 20px rgba(107,168,255,.28);transition:transform .15s,filter .15s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .btn.ghost{background:transparent;border:1.5px solid var(--edge);color:var(--muted);box-shadow:none}
  .btn.pink{background:linear-gradient(135deg,var(--accent2),#ffb3cf);color:#4a0f26}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}

  /* LANDING */
  #landing{align-items:center;justify-content:flex-end;text-align:center;background:radial-gradient(120% 80% at 50% 28%,#16223a,#070a10 74%)}
  #landing .hero{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:.55}
  #landing .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,16,.15),rgba(7,10,16,.96) 76%)}
  #landing .wrap{position:relative;z-index:2;padding:34px 30px 44px;width:100%}
  #landing .eyebrow{font-size:12px;letter-spacing:.5em;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:12px}
  #landing h1{font-size:clamp(38px,10vw,66px);font-weight:900;letter-spacing:-.02em;line-height:.98;
    background:linear-gradient(135deg,#fff,var(--soft) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  #landing .tag{color:var(--muted);margin:14px 0 26px;font-size:14.5px;line-height:1.6;max-width:30ch;margin-inline:auto}
  #landing .btn{width:min(80%,320px);margin:7px auto;display:block;font-size:17px;padding:16px}
  #landing .credit{color:var(--dim);font-size:11px;margin-top:20px;letter-spacing:.1em}

  /* HUB */
  #hub{background:linear-gradient(180deg,#0c1524,#080b12)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:10px;
    background:rgba(8,11,18,.72);border-bottom:1px solid var(--edge);backdrop-filter:blur(8px)}
  .topbar .lv{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .topbar .lvbadge{background:linear-gradient(135deg,var(--accent),#9cc4ff);color:#08213f;font-weight:900;font-size:13px;
    padding:5px 11px;border-radius:9px;white-space:nowrap}
  .topbar .xpwrap{flex:1;min-width:40px}
  .topbar .xpwrap .xpb{height:7px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
  .topbar .xpwrap .xpb>i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),#b6ffd6);transition:width .5s}
  .topbar .xpwrap small{font-size:10px;color:var(--dim)}
  .gold{display:flex;align-items:center;gap:6px;background:rgba(255,207,110,.12);border:1px solid rgba(255,207,110,.4);
    border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;color:var(--gold);white-space:nowrap}
  .tabs{display:flex;gap:6px;padding:12px 14px 4px}
  .tab{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--edge);color:var(--muted);font-family:var(--sans);
    font-weight:700;font-size:13.5px;padding:11px 6px;border-radius:11px;cursor:pointer;text-align:center}
  .tab.on{background:rgba(107,168,255,.16);border-color:var(--accent);color:var(--soft)}
  .hubbody{flex:1;overflow-y:auto;padding:16px 14px 26px}
  .sec-t{font-size:12px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;font-weight:700;margin:4px 2px 12px}
  .hcard{display:flex;gap:14px;background:rgba(18,24,36,.72);border:1px solid var(--edge);border-radius:18px;padding:14px;margin-bottom:14px}
  .hcard .por{width:92px;height:116px;border-radius:12px;background-size:cover;background-position:center top;flex:none;border:1px solid rgba(255,255,255,.08)}
  .hcard .info{flex:1;min-width:0;display:flex;flex-direction:column}
  .hcard .nm{font-weight:800;font-size:18px}
  .hcard .nm span{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
  .hcard .desc{color:var(--muted);font-size:12px;line-height:1.5;margin:4px 0 8px;flex:1}
  .stagebar .lab{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
  .stagebar .lab .st{color:var(--accent2);font-weight:800}
  .stagebar .lab .pct{color:var(--dim)}
  .bar{height:9px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),#ffb3cf);transition:width .6s}
  .row{display:flex;gap:8px;margin-top:11px}
  .row .btn{padding:11px 12px;font-size:14px;flex:1}
  .locked{opacity:.5}
  .locked .por{filter:grayscale(1) brightness(.6);display:flex;align-items:center;justify-content:center;font-size:30px}
  /* list items (story eps / talks / gifts) */
  .item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.035);border:1px solid var(--edge);
    border-radius:13px;padding:13px 15px;margin-bottom:10px}
  .item .ic{font-size:24px}
  .item .m{flex:1;min-width:0}
  .item .m b{font-size:15px}
  .item .m p{color:var(--muted);font-size:12px;line-height:1.4}
  .item .go{background:linear-gradient(135deg,var(--accent),#9cc4ff);color:#08213f;font-weight:800;font-size:13px;
    padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;border:none;font-family:var(--sans)}
  .item .go.gold{background:rgba(255,207,110,.16);border:1px solid rgba(255,207,110,.4);color:var(--gold)}
  .item .go:disabled{opacity:.4;cursor:not-allowed}
  .item.done{opacity:.6}

  /* DATE / VN */
  #vbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
  #vbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,12,.06) 40%,rgba(6,8,12,.82) 100%)}
  #vsp{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
  #vsp img{height:84%;object-fit:contain;filter:drop-shadow(0 8px 26px rgba(0,0,0,.55));transition:opacity .35s,transform .35s;opacity:0;transform:translateY(14px)}
  #vsp img.show{opacity:1;transform:translateY(0)}
  #vhud{position:absolute;top:14px;left:14px;right:14px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #vhud .aff{display:flex;align-items:center;gap:9px;background:rgba(10,14,22,.62);border:1px solid var(--edge);border-radius:999px;
    padding:7px 14px 7px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(6px);flex:1;max-width:250px}
  #vhud .aff .nm{color:var(--soft)}
  #vhud .aff .mini{flex:1;height:7px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
  #vhud .aff .mini>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),#ffb3cf);transition:width .5s}
  #vhud .gd{background:rgba(255,207,110,.14);border:1px solid rgba(255,207,110,.4);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;color:var(--gold)}
  #vbox{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 16px 20px;cursor:pointer}
  #vtag{display:inline-block;margin:0 0 -12px 20px;position:relative;z-index:2;background:linear-gradient(135deg,var(--accent2),#ffb3cf);
    color:#4a0f26;font-weight:800;font-size:16px;padding:6px 20px;border-radius:12px 12px 4px 12px}
  #vtag.narr{background:linear-gradient(135deg,#5b6craf,#8a97ad);color:#0e1116}
  #vpanel{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:24px 24px 28px;min-height:126px;backdrop-filter:blur(10px)}
  #vtext{font-size:18px;line-height:1.72;min-height:58px;text-wrap:pretty}
  #vadv{position:absolute;right:26px;bottom:14px;color:var(--accent2);font-size:14px;opacity:0;animation:bob 1.1s infinite}
  #vadv.show{opacity:.9}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  #vchoices{position:absolute;left:0;right:0;bottom:0;z-index:6;display:none;flex-direction:column;gap:11px;padding:18px 16px 22px}
  #vchoices.on{display:flex}
  #vchoices .qbox{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:16px 18px;font-size:17px;line-height:1.55;backdrop-filter:blur(10px)}
  #vchoices .qbox .qn{display:inline-block;background:linear-gradient(135deg,var(--gold),#ffe0a0);color:#4a3208;font-weight:800;font-size:14px;padding:3px 13px;border-radius:9px;margin-bottom:8px}
  #vchoices .qh{background:rgba(255,207,110,.1);border:1px solid rgba(255,207,110,.32);border-radius:12px;padding:8px 16px;font-size:12.5px;color:var(--gold);font-weight:700;text-align:center}
  .ch{background:rgba(18,24,36,.94);border:1.5px solid var(--edge);color:var(--ink);font-family:var(--sans);font-size:16px;font-weight:600;
    padding:15px 20px;border-radius:13px;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;opacity:0;transform:translateY(10px);text-align:left}
  .ch.in{opacity:1;transform:translateY(0)}
  .ch:hover{background:rgba(107,168,255,.14);border-color:var(--accent);transform:translateY(-2px)}
  .toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(10,14,22,.94);border:1px solid var(--edge);
    color:var(--soft);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .3s;white-space:nowrap}
  .toast.on{opacity:1}
  .toast.bad{color:#ff9db3;border-color:rgba(255,122,168,.4)} .toast.gold{color:var(--gold)} .toast.xp{color:var(--xp)}
  #overlay{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:30px;background:rgba(5,7,11,.88);backdrop-filter:blur(4px)}
  #overlay.on{display:flex}
  #overlay .big{font-size:60px;animation:pop .6s}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
  #overlay h2{font-size:24px;font-weight:900;margin:12px 0 6px}
  #overlay p{color:var(--muted);font-size:14px;margin-bottom:24px;line-height:1.6;white-space:pre-line}

  /* HUNT */
  #hunt{background:linear-gradient(180deg,#0e1420,#07090e);align-items:center;justify-content:center;text-align:center;padding:26px}
  #hunt .mon{width:min(70%,320px);aspect-ratio:1;background-size:contain;background-repeat:no-repeat;background-position:center;
    filter:drop-shadow(0 10px 30px rgba(255,80,80,.25))}
  #hunt h2{font-size:22px;font-weight:900;margin:8px 0}
  #hunt p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:18px;max-width:34ch}
  #hunt .btn{width:min(80%,320px);margin:6px auto;display:block}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <!-- LANDING -->
  <section class="screen on" id="landing">
    <div class="hero" id="landHero"></div>
    <div class="wrap">
      <div class="eyebrow">ETHERIA</div>
      <h1>공략의<br>여행</h1>
      <p class="tag">게이트로 이어졌던 세계, 에테리아. 대단절로 갈라진 나라들.<br>모험가인 당신이, 각 나라의 마음을 여는 자가 되어라.</p>
      <button class="btn" id="startBtn">여행 시작</button>
      <button class="btn ghost" id="contBtn">이어하기</button>
      <div class="credit">v0.3 · 아스라 왕국편 · 프로토타입</div>
    </div>
  </section>

  <!-- HUB -->
  <section class="screen" id="hub">
    <div class="topbar">
      <div class="lv">
        <span class="lvbadge">Lv.<span id="lvVal">1</span></span>
        <div class="xpwrap"><div class="xpb"><i id="xpBar"></i></div><small id="xpTxt">EXP</small></div>
      </div>
      <div class="gold">💰 <span id="goldVal">0</span></div>
    </div>
    <div class="tabs">
      <div class="tab on" data-t="story">📖 스토리</div>
      <div class="tab" data-t="talk">💬 대화</div>
      <div class="tab" data-t="gift">🎁 선물</div>
      <div class="tab" data-t="hunt">⚔️ 사냥</div>
    </div>
    <div class="hubbody" id="hubBody"></div>
  </section>

  <!-- DATE / VN -->
  <section class="screen" id="date">
    <div id="vbg"></div>
    <div id="vsp"><img id="vspImg" alt=""></div>
    <div id="vhud">
      <div class="aff"><span>♥</span><span class="nm">엘리아나</span><span class="mini"><i id="vMini"></i></span><span id="vStage" style="color:var(--accent2);font-weight:800"></span></div>
      <div class="gd">💰 <span id="vGold">0</span></div>
    </div>
    <div id="vbox"><div id="vtag"></div><div id="vpanel"><div id="vtext"></div></div><div id="vadv">▼</div></div>
    <div id="vchoices"></div>
    <div class="toast" id="toast"></div>
  </section>

  <!-- HUNT -->
  <section class="screen" id="hunt">
    <div class="mon" id="monImg"></div>
    <h2 id="huntTitle">마수 · 그림자 야수</h2>
    <p id="huntDesc">대단절의 균열에서 새어 나온 마수. 사냥해서 경험치와 골드를 얻자. (강해질수록 엘리아나가 당신을 다시 본다)</p>
    <button class="btn pink" id="huntBtn">⚔️ 사냥한다</button>
    <button class="btn ghost" id="huntBack">허브로</button>
  </section>

  <div id="overlay"></div>

   {sp:"neutral",name:"엘리아나",text:"엘리아나. 왕국 기사단 부단장이다. 딱히 친해질 생각은 없으니 그리 알아."},
   {sp:"smile",name:"엘리아나",text:"…내일도 이 시간에 여기 있을 거야. 뭐, 네가 또 온다는 건 아니지만."},
 ],end:"― 첫 만남. 얼음 같은 표정 아래, 아주 작은 균열이 생겼다."},

 {id:"ep2",title:"훈련장의 내기",sub:"도발적인 검의 내기",reqAff:15,gold:30,bg:"asra_training",nodes:[
   {bg:"asra_training",sp:"neutral",name:"엘리아나",text:"또 왔군. …흥, 진짜 올 줄은 몰랐는데. 마침 심심하던 참이야. 나랑 한 판 어때, 여행자."},
   {sp:"smug",name:"엘리아나",text:"내가 이기면 넌 두 번 다시 이 성에 못 와. 네가 이기면… 뭐든 하나 들어주지."},
   {narr:1,text:"― 목검이 부딪친다. 그녀의 검은 빠르고 정확하다. 하지만 당신은 끝까지 물러서지 않는다."},
   {sp:"surprise",name:"엘리아나",text:"…제법이잖아? 이 정도로 버티는 사람은 오랜만인데."},
   {narr:1,text:"― 마지막 합. 당신은 검을 흘리며 그녀의 손목을 잡아 끌어당긴다. 두 사람의 거리가 순식간에 사라진다."},
   {sp:"blush",name:"엘리아나",text:"!! …이, 이렇게 가까이…! 반칙이야, 이런 건 반칙이라고…!"},
   {sp:"blush",name:"엘리아나",text:"(심장 소리… 들릴 것 같아.) …져, 졌어. 이번엔 내가 졌다고. 그러니까 이제… 손, 놔줘."},
   {sp:"smile",name:"엘리아나",text:"…다음엔 순찰 없는 날에 와. 그, 그럼 조금 더… 아니, 아무것도 아니야!"},
 ],end:"― 검을 맞댄 사이, 마음의 거리도 좁혀졌다. 그녀의 얼굴에서 웃음을 봤다."},

 {id:"ep3",title:"달빛 아래, 무너지는 기사",sub:"'설렘' 단계에서 열림",reqAff:45,gold:40,bg:"asra_night",nodes:[
   {bg:"asra_night",sp:"blush",name:"엘리아나",text:"…이 시간에 부른 이유, 물어보지 마. 그냥… 너랑 둘이 있고 싶었어. 오늘은."},
   {sp:"blush",name:"엘리아나",text:"기사복도 벗고, 검도 놓고… 이런 나, 너 말고는 아무도 본 적 없어."},
   {narr:1,text:"― 달빛 아래, 갑옷을 벗은 그녀는 놀랄 만큼 여리고 아름다웠다."},
   {sp:"blush",name:"엘리아나",text:"…가까이 와. 도망 안 갈 거지? …나, 이런 거 처음이라 서툴러도… 봐줘."},
 ],end:"― 얼음 같던 기사가, 당신 앞에서만 온전히 무너진다.\n(💗 수위 연출/CG는 여기 이어서 채워 넣습니다.)"},
];

/* ============ STATE ============ */
const DEF={seen:false,gold:0,exp:0,lv:1,aff:0,epDone:[]};
let ST=load();
function load(){try{const s=JSON.parse(localStorage.getItem("eth_v3"));return s?{...DEF,...s}:{...DEF};}catch(e){return{...DEF};}}
function save(){localStorage.setItem("eth_v3",JSON.stringify(ST));}
const xpNeed=lv=>lv*100;

/* ============ NAV ============ */
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function show(id){$$(".screen").forEach(s=>s.classList.remove("on"));$("#"+id).classList.add("on");}
const SPR=window.SPRITES||{},BG=window.BGS||{};
$("#landHero").style.backgroundImage=`url(${BG.asra_rampart||BG.asra_castle||""})`;
$("#monImg").style.backgroundImage=`url(${SPR.shadowbeast||""})`;
function refreshCont(){$("#contBtn").disabled=!ST.seen;}
$("#startBtn").onclick=()=>{ST.seen=true;save();openHub("story");};
$("#contBtn").onclick=()=>openHub("story");
refreshCont();

/* ============ HUB ============ */
let hubTab="story";
$$(".tab").forEach(t=>t.onclick=()=>openHub(t.dataset.t));
function topHud(){
  $("#lvVal").textContent=ST.lv;$("#goldVal").textContent=ST.gold;
  const need=xpNeed(ST.lv);$("#xpBar").style.width=Math.min(100,ST.exp/need*100)+"%";$("#xpTxt").textContent=`EXP ${ST.exp}/${need}`;
}
function openHub(tab){
  hubTab=tab||hubTab;show("hub");topHud();
  $$(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===hubTab));
  const b=$("#hubBody");b.innerHTML="";
  if(hubTab==="story")renderStory(b);
  else if(hubTab==="talk")renderTalk(b);
  else if(hubTab==="gift")renderGift(b);
  else if(hubTab==="hunt"){show("hunt");}
}
function heroCard(){
  const a=ST.aff,st=stageOf(a),si=stageIdx(a);
  return `<div class="hcard"><div class="por" style="background-image:url(${SPR.eliana_neutral||""})"></div>
    <div class="info"><div class="nm">엘리아나<span>아스라 · 기사단 부단장</span></div>
    <div class="desc">겉은 얼음, 속은 여린 최강의 여기사. '실력 인정'과 '진심'에 약하다.</div>
    <div class="stagebar"><div class="lab"><span class="st">${st.name} ${si>=4?'💖':''}</span><span class="pct">${a}/100 ♥</span></div>
    <div class="bar"><i style="width:${Math.min(100,a)}%"></i></div></div></div></div>`;
}
function renderStory(b){
  b.innerHTML=`<div class="sec-t">제1장 · 아스라 왕국</div>`+heroCard()+`<div class="sec-t">스토리 에피소드</div>`;
  EPS.forEach((ep,i)=>{
    const cleared=ST.epDone.includes(ep.id);
    const prevOk=i===0||ST.epDone.includes(EPS[i-1].id);
    const affOk=ST.aff>=ep.reqAff;
    const open=prevOk&&affOk;
    let btn = cleared?`<button class="go" data-ep="${ep.id}">다시 보기</button>`
      :(open?`<button class="go" data-ep="${ep.id}">진행</button>`
      :`<button class="go" disabled>🔒 ${!prevOk?'이전 에피소드':`호감도 ${ep.reqAff}`}</button>`);
    b.insertAdjacentHTML("beforeend",`<div class="item ${cleared?'done':''}"><div class="ic">${cleared?'✅':'📖'}</div>
      <div class="m"><b>${ep.title}</b><p>${ep.sub}</p></div>${btn}</div>`);
  });
  b.querySelectorAll(".go[data-ep]").forEach(x=>x.onclick=()=>startEp(EPS.find(e=>e.id===x.dataset.ep)));
}
function renderTalk(b){
  b.innerHTML=heroCard()+`<div class="sec-t">💬 대화하기 — 성격을 읽고 답하면 호감도↑</div>
    <div class="item"><div class="ic">💬</div><div class="m"><b>엘리아나와 대화</b><p>랜덤 질문에 그녀의 성격(도도한 츤데레·실력 인정에 약함)에 맞게 답하기</p></div>
    <button class="go" id="talkGo">시작</button></div>
    <div style="color:var(--dim);font-size:12px;padding:4px 6px">💡 힌트: 느끼한 아부·가벼운 태도는 역효과. 실력 인정·진심·배려가 통해요.</div>`;
  $("#talkGo").onclick=startTalk;
}
function renderGift(b){
  b.innerHTML=heroCard()+`<div class="sec-t">🎁 선물 — 골드로 호감도 부스트 (💗=엘리아나 최애 +50%)</div>`;
  GIFTS.forEach(g=>{
    b.insertAdjacentHTML("beforeend",`<div class="item"><div class="ic">${g.ic}</div>
      <div class="m"><b>${g.name} ${g.fav?'💗':''}</b><p>${g.desc} · 호감도 +${g.fav?Math.round(g.aff*1.5):g.aff}</p></div>
      <button class="go gold" data-g="${g.id}" ${ST.gold<g.cost?'disabled':''}>💰${g.cost}</button></div>`);
  });
  b.querySelectorAll(".go[data-g]").forEach(x=>x.onclick=()=>{
    const g=GIFTS.find(y=>y.id===x.dataset.g);if(ST.gold<g.cost)return;
    ST.gold-=g.cost;const add=g.fav?Math.round(g.aff*1.5):g.aff;const before=ST.aff;ST.aff=Math.min(100,ST.aff+add);save();
    openHub("gift");flashStage(before,ST.aff);
  });
}

/* ============ HUNT (RPG: level + gold only) ============ */
$("#huntBack").onclick=()=>openHub("story");
$("#huntBtn").onclick=()=>{
  const goldGain=8+Math.floor(Math.random()*8)+ST.lv*2;
  const expGain=12+Math.floor(Math.random()*10)+ST.lv*2;
  ST.gold+=goldGain;ST.exp+=expGain;
  // 강함 증명 → 엘리아나 소량 호감 (RPG↔로맨스)
  let affLine="";const beforeA=ST.aff;
  if(Math.random()<0.5){ST.aff=Math.min(100,ST.aff+1);affLine="  엘리아나 호감 +1 ♥";}
  let lvUp=false;
  while(ST.exp>=xpNeed(ST.lv)){ST.exp-=xpNeed(ST.lv);ST.lv++;lvUp=true;}
  save();
  if(lvUp){bigOverlay("⚔️",`레벨 업! Lv.${ST.lv}`,`강해졌다. 마수를 더 사냥하거나 엘리아나를 만나러 가자.\n골드 +${goldGain} · EXP +${expGain}${affLine}`,()=>openHub("hunt"));}
  else{ overlayFlash(`마수 처치! 💰+${goldGain}  ⚔️EXP+${expGain}${affLine}`); flashStage(beforeA,ST.aff); }
};
function overlayFlash(msg){ // quick toast on hunt screen
  let t=document.querySelector("#huntToast");
  if(!t){t=document.createElement("div");t.id="huntToast";t.className="toast";$("#hunt").appendChild(t);}
  t.textContent=msg;t.className="toast on gold";setTimeout(()=>t.classList.remove("on"),1600);
}

/* ============ VN ENGINE (episodes + talks) ============ */
const vbg=$("#vbg"),vsp=$("#vspImg"),vtext=$("#vtext"),vtag=$("#vtag"),vadv=$("#vadv"),vch=$("#vchoices"),
      vMini=$("#vMini"),vStage=$("#vStage"),vGold=$("#vGold"),toastEl=$("#toast");
let queue=[],qi=0,typing=false,curFull="",curBg="",curSp="__none__",afterCb=null,curEp=null;
function setBg(k){if(k===curBg)return;curBg=k;vbg.style.opacity=0;setTimeout(()=>{vbg.style.backgroundImage=`url(${BG[k]||""})`;vbg.style.opacity=1;},180);}
function setSp(k){if(k===curSp)return;curSp=k;if(!k){vsp.classList.remove("show");return;}vsp.classList.remove("show");
  setTimeout(()=>{vsp.src=SPR["eliana_"+k]||SPR[k]||"";requestAnimationFrame(()=>vsp.classList.add("show"));},160);}
function vHud(){vMini.style.width=Math.min(100,ST.aff)+"%";vStage.textContent=stageOf(ST.aff).name;vGold.textContent=ST.gold;}
function toast(m,cls){toastEl.className="toast on"+(cls?" "+cls:"");toastEl.textContent=m;setTimeout(()=>toastEl.classList.remove("on"),1500);}
function typew(t){typing=true;curFull=t;vtext.textContent="";vadv.classList.remove("show");let i=0;
  const step=()=>{if(!typing)return;vtext.textContent=t.slice(0,i);i++;if(i<=t.length)setTimeout(step,20);else{typing=false;vadv.classList.add("show");}};step();}

function startEp(ep){curEp=ep;queue=ep.nodes;qi=0;afterCb=()=>{ // on ep end
    const before=ST.aff; if(!ST.epDone.includes(ep.id)){ST.epDone.push(ep.id);ST.gold+=ep.gold;save();}
    bigOverlay("📖",ep.title+" 완료",`${ep.end}\n\n골드 +${ep.gold} 💰`,()=>{flashStage(before,ST.aff,()=>openHub("story"));});
  };
  curBg="";curSp="__none__";show("date");vHud();vStep();}
function vStep(){
  if(qi>=queue.length){afterCb&&afterCb();return;}
  const n=queue[qi];
  if(n.q){vShowQ(n.q,()=>{qi++;vStep();});return;}
  if(n.bg)setBg(n.bg);else if(curEp&&curBg==="")setBg(curEp.bg);
  setSp(n.sp||null);
  vtag.textContent=n.name||"";vtag.className=n.narr?"narr":"";vtag.style.display=n.name?"inline-block":"none";
  typew(n.text);
}
$("#vbox").onclick=()=>{if(vch.classList.contains("on"))return;
  if(typing){typing=false;vtext.textContent=curFull;vadv.classList.add("show");return;}qi++;vStep();};
function scoreOf(fit){return fit==="good"?2:fit==="bad"?0:1;}
function vShowQ(q,cb){
  setSp(q.sp||curSp);$("#vbox").style.display="none";
  vch.innerHTML=`<div class="qbox"><span class="qn">엘리아나</span><br>${q.text}</div><div class="qh">💬 성격을 읽고 답하세요</div>`;
  vch.classList.add("on");
  q.a.forEach((c,i)=>{const b=document.createElement("button");b.className="ch";b.textContent=c.t;
    b.onclick=()=>{vch.classList.remove("on");vch.innerHTML="";$("#vbox").style.display="";
      const sc=scoreOf(c.fit),aff=[0,6,12][sc],gold=[3,10,18][sc],before=ST.aff;
      ST.aff=Math.min(100,ST.aff+aff);ST.gold+=gold;save();vHud();
      if(sc===2)toast(`정답! 호감 +${aff} ♥ 골드 +${gold}`,"gold");else if(sc===1)toast(`무난… +${aff} ♥`,"");else toast("역효과…","bad");
      const r=c.reply;vtag.textContent="엘리아나";vtag.className="";vtag.style.display="inline-block";if(r.sp)setSp(r.sp);typew(r.text);
      const once=()=>{if(typing){typing=false;vtext.textContent=curFull;vadv.classList.add("show");return;}$("#vbox").removeEventListener("click",once);flashStage(before,ST.aff,cb);};
      setTimeout(()=>$("#vbox").addEventListener("click",once),50);
    };
    vch.appendChild(b);setTimeout(()=>b.classList.add("in"),80+i*90);});
}
// standalone talk (random Q from TALKS)
function startTalk(){
  const t=TALKS[Math.floor((Date.now()/1000)%TALKS.length)]; // vary without Math.random dependency on load
  curEp={bg:"asra_training"};queue=[{bg:"asra_training",sp:"neutral",name:"엘리아나",text:"…무슨 일이야. 할 말 있으면 해."},
    {q:{sp:"neutral",text:"「"+t.q+"」",a:t.a.map(x=>({t:x.t,fit:x.fit,reply:{sp:x.fit==="good"?"blush":x.fit==="bad"?"angry":"neutral",text:x.reply}}))}}];
  qi=0;afterCb=()=>{const before=ST.aff;bigOverlay("💬","대화 종료",`엘리아나와 대화했다.\n현재 단계: ${stageOf(ST.aff).name}`,()=>openHub("talk"));};
  curBg="";curSp="__none__";show("date");vHud();vStep();
}

/* ============ overlays ============ */
const ov=$("#overlay");
function bigOverlay(icon,title,body,cb){ov.innerHTML=`<div class="big">${icon}</div><h2 style="color:var(--accent2)">${title}</h2><p>${body}</p><button class="btn" id="ovOk">계속</button>`;
  ov.classList.add("on");$("#ovOk").onclick=()=>{ov.classList.remove("on");cb&&cb();};}
function flashStage(before,after,cb){const bi=stageIdx(before),ai=stageIdx(after);
  if(ai>bi){const ns=STAGES[ai];bigOverlay("💗",`${ns.name} 단계 진입!`,`엘리아나와의 관계가 깊어졌다.\n새로운 이야기가 열립니다.`,cb);}
  else cb&&cb();}
document.body.tabIndex=0;
</script>
