<title>에테리아 — 실바르나의 엘프</title>
<style>
  :root{
    --bg:#12141a; --panel:rgba(20,24,32,.85); --panel-edge:rgba(120,220,170,.32);
    --rose:#ff7aa8; --accent:#68e0a6; --accent-soft:#c9ffe4; --gold:#ffcf6e; --ink:#f4f8f6; --muted:#b7c6bf;
    --sans:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#090b0e;font-family:var(--sans);color:var(--ink);overflow:hidden;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:min(100vw,900px);aspect-ratio:9/16;max-height:100vh;
    background:var(--bg);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none}
  @media(min-aspect-ratio:1/1){#stage{aspect-ratio:16/10;width:min(100vw,1000px)}}
  .layer{position:absolute;inset:0}
  #bg{background-size:cover;background-position:center;transition:opacity .5s, transform 7s ease-out;transform:scale(1.05)}
  #bg.show{transform:scale(1.13)}
  #bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,11,14,.1) 40%,rgba(9,11,14,.78) 100%)}
  #sprite{display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
  #sprite img{height:84%;max-height:84%;object-fit:contain;filter:drop-shadow(0 8px 26px rgba(0,0,0,.55));
    transition:opacity .35s, transform .35s;opacity:0;transform:translateY(14px)}
  #sprite img.show{opacity:1;transform:translateY(0)}
  #hud{position:absolute;top:14px;left:14px;z-index:5;display:flex;align-items:center;gap:8px;
    background:rgba(20,24,32,.6);border:1px solid var(--panel-edge);border-radius:999px;padding:7px 14px 7px 11px;
    font-size:14px;font-weight:700;backdrop-filter:blur(6px)}
  #hud .heart{color:var(--rose);font-size:16px;transition:transform .3s}
  #hud.pulse .heart{transform:scale(1.5)}
  #hud .nm{color:var(--accent-soft)}
  #menuBtn{position:absolute;top:14px;right:14px;z-index:5;background:rgba(20,24,32,.6);
    border:1px solid var(--panel-edge);border-radius:999px;color:var(--muted);font-family:var(--sans);
    font-size:12px;font-weight:700;padding:8px 13px;cursor:pointer}
  #menuBtn:hover{color:var(--ink)}
  #dbox{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 16px 20px;cursor:pointer}
  #nametag{display:inline-block;margin:0 0 -12px 20px;position:relative;z-index:2;
    background:linear-gradient(135deg,var(--accent),#9af0c6);color:#0c3524;font-weight:800;font-size:16px;
    letter-spacing:.03em;padding:6px 20px;border-radius:12px 12px 4px 12px;box-shadow:0 4px 14px rgba(104,224,166,.32)}
  #nametag.narr{background:linear-gradient(135deg,#6b7280,#9aa4ad);color:#12151a}
  #panel{background:var(--panel);border:1px solid var(--panel-edge);border-radius:18px;
    padding:26px 26px 30px;min-height:132px;backdrop-filter:blur(10px);box-shadow:0 -6px 30px rgba(0,0,0,.4)}
  #text{font-size:19px;line-height:1.75;min-height:66px;text-wrap:pretty}
  #adv{position:absolute;right:26px;bottom:14px;color:var(--accent);font-size:14px;opacity:0;animation:bob 1.1s infinite}
  #adv.show{opacity:.9}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  #choices{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;background:rgba(9,11,14,.5)}
  #choices.show{display:flex}
  .choice{width:min(100%,460px);background:rgba(22,28,36,.94);border:1.5px solid var(--panel-edge);
    color:var(--ink);font-family:var(--sans);font-size:17px;font-weight:600;padding:16px 22px;border-radius:14px;
    cursor:pointer;transition:transform .15s,background .15s,border-color .15s;opacity:0;transform:translateY(10px)}
  .choice.in{opacity:1;transform:translateY(0)}
  .choice:hover{background:rgba(104,224,166,.15);border-color:var(--accent);transform:translateY(-2px)}
  #title{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;background:radial-gradient(120% 90% at 50% 22%,#16342a 0%,#0d1218 68%)}
  #title .eyebrow{font-size:12px;letter-spacing:.45em;color:var(--accent);text-transform:uppercase;margin-bottom:14px;font-weight:700}
  #title h1{font-size:clamp(30px,7.5vw,52px);font-weight:900;letter-spacing:-.01em;line-height:1.08;
    background:linear-gradient(135deg,#fff,var(--accent-soft) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  #title .sub{color:var(--gold);font-weight:800;font-size:16px;margin-top:10px;letter-spacing:.05em}
  #title p{color:var(--muted);margin:16px 0 32px;font-size:14.5px;max-width:26ch;line-height:1.65}
  .btn{width:min(78%,300px);background:linear-gradient(135deg,var(--accent),#9af0c6);color:#0c3524;
    font-family:var(--sans);font-weight:800;font-size:17px;border:none;padding:15px;border-radius:14px;cursor:pointer;
    margin:7px 0;box-shadow:0 8px 22px rgba(104,224,166,.32);transition:transform .15s,filter .15s}
  .btn.ghost{background:transparent;border:1.5px solid var(--panel-edge);color:var(--muted);box-shadow:none}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .fade{animation:f .6s}@keyframes f{from{opacity:0}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(20,24,32,.92);
    border:1px solid var(--panel-edge);color:var(--accent-soft);padding:10px 20px;border-radius:999px;font-size:14px;
    font-weight:700;opacity:0;transition:opacity .3s}
  .toast.show{opacity:1}
</style>

<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="sprite" class="layer"><img id="spriteImg" alt=""></div>
  <div id="hud"><span class="heart">♥</span><span>리엔</span><span class="nm" id="affVal">0</span></div>
  <button id="menuBtn">≡ 메뉴</button>
  <div id="dbox">
    <div id="nametag"></div>
    <div id="panel"><div id="text"></div></div>
    <div id="adv">▼</div>
  </div>
  <div id="choices"></div>
  <div class="toast" id="toast"></div>
  <div id="title">
    <div class="eyebrow">ETHERIA · Chapter 1</div>
    <h1>에테리아</h1>
    <div class="sub">제1장 — 실바르나의 엘프</div>
    <p>수많은 나라가 공존하는 세계, 에테리아.<br>여행자인 당신이 첫 번째로 발을 들인 곳은<br>엘프의 숲의 왕국 '실바르나'.</p>
    <button class="btn" id="newBtn">여행 시작</button>
    <button class="btn ghost" id="contBtn">이어하기</button>
  </div>
</div>

<script>
const S = [
 {bg:"forest", sp:null, name:"", narr:1, text:"― 에테리아, 실바르나 왕국. 빛나는 고목들이 가득한 엘프의 숲."},
 {bg:"forest", sp:null, name:"", narr:1, text:"― 여행자인 당신은 숲의 경계를 넘어선다. 그 순간—"},
 {bg:"forest", sp:"angry", name:"리엔", text:"멈춰라, 인간. 여기서부터는 엘프의 영역이다. 한 걸음도 더 들이지 마라."},
 {bg:"forest", sp:"neutral", name:"리엔", text:"…이름을 대라. 무슨 목적으로 실바르나에 왔지?"},
 {choice:[
    {t:"「그저 세상을 여행하는 나그네일 뿐입니다.」", aff:1, go:"a1"},
    {t:"「당신처럼 아름다운 엘프를 만나러 왔죠.」", aff:2, go:"a1"},
    {t:"「길을 잃었어. 좀 도와줄래?」", aff:0, go:"a1"},
 ]},
 {label:"a1"},
 {bg:"forest", sp:"angry", name:"리엔", text:"흥, 말은 번지르르하군. 인간의 혀는 믿지 않아. …하지만 규칙이지. 손님은 왕궁으로 안내해야 하니."},
 {bg:"forest", sp:"neutral", name:"리엔", text:"따라와. 허튼짓하면… 이 검이 용서치 않을 거다."},
 {bg:"palace", sp:"neutral", name:"", narr:1, text:"― 실바르나 왕궁. 흰 대리석과 초록 덩굴이 어우러진 아름다운 홀."},
 {bg:"palace", sp:"neutral", name:"리엔", text:"…이 나라는 오랫동안 인간에게 배신당했다. 그래서 우린 인간을 경계해."},
 {bg:"palace", sp:"neutral", name:"준호", text:"(생각보다 말을 많이 하네. 조금 마음을 여는 걸까.)"},
 {bg:"palace", sp:"neutral", name:"리엔", text:"뭘 그렇게 빤히 봐. …기분 나쁘게."},
 {choice:[
    {t:"「당신 눈이 에메랄드 같아서요. 넋 놓고 봤네요.」", aff:2, go:"a2"},
    {t:"「엘프도 인간을 미워할 수 있구나 싶어서.」", aff:1, go:"a2"},
    {t:"「아뇨, 그냥 벽을 보고 있었어요.」", aff:0, go:"a2"},
 ]},
 {label:"a2"},
 {bg:"palace", sp:"blush", name:"리엔", text:"에, 에메랄드…?! 갑자기 그런… 너, 정말 인간답지 않게 뻔뻔하구나."},
 {bg:"palace", sp:"blush", name:"리엔", text:"…하지만. 나쁘진 않았어. …아무것도 아니야! 잊어버려!"},
 {bg:"palace", sp:"smile", name:"리엔", text:"…밤이 되면 호수가 아름다워. 특별히 보여주지. 인간에게 이런 건 처음이야."},
 {bg:"lake", sp:"neutral", name:"", narr:1, text:"― 달빛 호수. 푸르게 빛나는 물결 위로 별이 쏟아진다."},
 {bg:"lake", sp:"smile", name:"리엔", text:"…예쁘지? 난 슬플 때마다 여기 왔어. 이 물결을 보면 마음이 가라앉거든."},
 {bg:"lake", sp:"neutral", name:"리엔", text:"…있잖아. 넌 왜 인간인데도 이렇게… 무섭지가 않을까. 이상해."},
 {bg:"lake", sp:"blush", name:"리엔", text:"(달빛에 비친 그녀의 뺨이 발그레하다. 지금이 기회일지도.)", },
 {choice:[
    {t:"「손, 잡아도 될까요?」", aff:3, go:"a3"},
    {t:"「당신 곁이라면 언제까지고 있고 싶어.」", aff:3, go:"a3b"},
    {t:"「…슬슬 돌아가야겠네요.」", aff:0, go:"a3c"},
 ]},
 {label:"a3"},
 {bg:"lake", sp:"blush", name:"리엔", text:"!! …마, 마음대로 해. 딱히… 싫진 않으니까. (살며시 손을 내민다.)"},

const $=s=>document.querySelector(s);
const bgEl=$("#bg"), spImg=$("#spriteImg"), textEl=$("#text"), nameEl=$("#nametag"),
      advEl=$("#adv"), choicesEl=$("#choices"), affEl=$("#affVal"), hud=$("#hud"),
      titleEl=$("#title"), toastEl=$("#toast");
let idx=0, aff=0, typing=false, curFull="", labelMap={}, curBg="", curSp="__none__";
S.forEach((n,i)=>{ if(n.label) labelMap[n.label]=i; });
const SPR=window.SPRITES||{}, BG=window.BGS||{};
function setBg(k){ if(k===curBg)return; curBg=k; bgEl.style.opacity=0;
  setTimeout(()=>{ bgEl.style.backgroundImage=`url(${BG[k]||""})`; bgEl.style.opacity=1; bgEl.classList.toggle("show"); },180); }
function setSp(k){ if(k===curSp)return; curSp=k;
  if(!k){ spImg.classList.remove("show"); return; }
  spImg.classList.remove("show");
  setTimeout(()=>{ spImg.src=SPR[k]||""; requestAnimationFrame(()=>spImg.classList.add("show")); },160); }
function setAff(v){ aff=v; affEl.textContent=aff; hud.classList.add("pulse"); setTimeout(()=>hud.classList.remove("pulse"),320); }
function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),1400); }
function typewrite(t){ typing=true; curFull=t; textEl.textContent=""; advEl.classList.remove("show");
  let i=0; const step=()=>{ if(!typing)return; textEl.textContent=t.slice(0,i); i++;
    if(i<=t.length) setTimeout(step,22); else { typing=false; advEl.classList.add("show"); } }; step(); }
function render(){
  if(idx>=S.length){ toTitle(); return; }
  const n=S[idx];
  if(n.label){ idx++; return render(); }
  if(n.jump!==undefined){ idx=labelMap[n.jump]; return render(); }
  if(n.branch){ for(const b of n.branch){ if(aff>=b.min){ idx=labelMap[b.go]; return render(); } } idx=labelMap[n.else]; return render(); }
  if(n.choice){ showChoices(n.choice); return; }
  if(n.end!==undefined){ showEnd(n.end); return; }
  if(n.bg) setBg(n.bg);
  setSp(n.sp||null);
  nameEl.textContent=n.name||"";
  nameEl.className = n.narr ? "narr" : "";
  nameEl.style.display=n.name?"inline-block":"none";
  typewrite(n.text); save();
}
function advance(){ if(choicesEl.classList.contains("show"))return;
  if(typing){ typing=false; textEl.textContent=curFull; advEl.classList.add("show"); return; }
  idx++; render(); }
function showChoices(list){ choicesEl.innerHTML=""; choicesEl.classList.add("show");
  list.forEach((c,i)=>{ const b=document.createElement("button"); b.className="choice"; b.textContent=c.t;
    b.onclick=()=>{ if(c.aff){ setAff(aff+c.aff); toast(`리엔 호감도 +${c.aff} ♥`); }
      choicesEl.classList.remove("show"); idx=labelMap[c.go]; setTimeout(render,120); };
    choicesEl.appendChild(b); setTimeout(()=>b.classList.add("in"),80+i*90); }); }
function showEnd(msg){ choicesEl.innerHTML=`<div style="max-width:460px;text-align:center">
  <div style="font-size:20px;font-weight:900;color:var(--accent-soft);margin-bottom:18px;white-space:pre-line;line-height:1.6">${msg}</div>
  <button class="btn" id="againBtn">처음으로</button></div>`;
  choicesEl.classList.add("show"); $("#againBtn").onclick=()=>{ localStorage.removeItem("eth_save"); toTitle(); }; }
function save(){ localStorage.setItem("eth_save",JSON.stringify({idx,aff})); refreshCont(); }
function load(){ try{ const s=JSON.parse(localStorage.getItem("eth_save")); if(s){ idx=s.idx; setAff(s.aff||0);} }catch(e){} }
function refreshCont(){ $("#contBtn").disabled=!localStorage.getItem("eth_save"); }
function start(fresh){ titleEl.style.display="none"; if(fresh){ idx=0; setAff(0);} curBg=""; curSp="__none__"; render(); }
function toTitle(){ titleEl.style.display="flex"; titleEl.classList.add("fade"); refreshCont(); }
$("#dbox").onclick=advance;
$("#menuBtn").onclick=(e)=>{ e.stopPropagation(); save(); toTitle(); };
$("#newBtn").onclick=()=>start(true);
$("#contBtn").onclick=()=>{ load(); start(false); };
document.body.tabIndex=0; document.body.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&titleEl.style.display==="none"){ e.preventDefault(); advance(); } });
refreshCont();
</script>
